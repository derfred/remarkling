# Rendered by scripts/deploy.sh: __PLACEHOLDERS__ come from .env.production and
# the image line is replaced with the CI-built sha tag. Secrets (tokens, API
# keys) come from the remarkling-secrets Secret that deploy.sh creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remarkling
  namespace: remarkling
  labels:
    app.kubernetes.io/name: remarkling
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume + SQLite: one pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: remarkling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remarkling
      annotations:
        # Changes whenever the Secret's contents change, so a secret-only
        # deploy still rolls the pod (envFrom is read only at start).
        remarkling/secrets-checksum: "__SECRETS_CHECKSUM__"
    spec:
      # The `default` ServiceAccount carries the `registry` pull secret
      # (bugzoo-infrastructure custom-app stub).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001   # pwuser in the Playwright image (asserted in the Dockerfile)
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/derfred/remarkling:latest  # managed by CI — replaced with SHA on deploy
          args: ["inkbridge", "serve", "--port", "8000"]
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom: &envFrom
            - secretRef:
                name: remarkling-secrets
          env: &env
            - {name: DATA_DIR, value: /data}
            - {name: MCP_ALLOWED_HOSTS, value: "__DOMAIN__"}
            - {name: TRILIUM_URL, value: "__TRILIUM_URL__"}
            - {name: TRILIUM_PUBLIC_URL, value: "__TRILIUM_PUBLIC_URL__"}
            - {name: POLL_INTERVAL_S, value: "__POLL_INTERVAL_S__"}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "2", memory: 1536Mi}  # Chromium renders and 2x page PNGs
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: shm, mountPath: /dev/shm}
        - name: poller
          image: ghcr.io/derfred/remarkling:latest  # managed by CI — replaced with SHA on deploy
          args: ["python", "-m", "inkbridge.poller"]
          securityContext: *containerSecurity
          envFrom: *envFrom
          env: *env
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remarkling-data
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
