# Copy to secret.yaml, fill in, apply with kubectl (do not commit the filled-in copy).
apiVersion: v1
kind: Secret
metadata:
  name: inkbridge
  namespace: inkbridge
type: Opaque
stringData:
  RM_TRANSPORT: cloud
  RM_DEVICE_TOKEN: ""          # inkbridge register <code>
  ANTHROPIC_API_KEY: ""
  TRILIUM_URL: http://trilium.trilium.svc.cluster.local:8080
  TRILIUM_PUBLIC_URL: https://notes.remarkling.co
  TRILIUM_ETAPI_TOKEN: ""
  TRILIUM_PARENT_NOTE: ""      # note ID of the "reMarkable" parent note
  API_TOKEN: ""                # iPhone Shortcuts
  MCP_TOKEN: ""                # claude.ai connector
  MCP_ALLOWED_HOSTS: inkbridge.remarkling.co
  POLL_INTERVAL_S: "300"
