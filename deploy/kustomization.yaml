apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inkbridge
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Create the Secret from secret.example.yaml (kept out of git) or your secrets tool of choice.
images:
  - name: inkbridge
    newName: ghcr.io/remarkling/inkbridge
    newTag: latest
